<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#120d10" />
    <script>
      (function () {
        var t = localStorage.getItem("my-sommelier-tema");
        var escuro = t === "claro" ? false : t === "sistema" ? window.matchMedia("(prefers-color-scheme: dark)").matches : true;
        document.documentElement.setAttribute("data-theme", escuro ? "dark" : "light");
        if (escuro) document.documentElement.classList.add("dark");
        var e = localStorage.getItem("my-sommelier-estilo");
        document.documentElement.setAttribute("data-estilo", e === "karanu-azul" || e === "karanu-bordo" ? e : "classico");
      })();
    </script>
    <!-- Fonte do design system Mitra (Geist 400/500/600) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Karanu</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
